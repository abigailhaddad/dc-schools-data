name: Refresh DC schools catalog

# Layer-1 (deterministic) automation: weekly re-download + re-profile + regenerate,
# committing any drift. Catches in-place file updates and dead links. Does NOT
# discover new files/years or resolve Box/Egnyte — run the update-dc-schools-data
# skill for that.
#
# Safety rails (added Nov 2026, after the 2026-11-01 run silently published 27
# dead PCSB links when PCSB moved its site):
#   * Any link that was ok last run and is broken now opens (or comments on) a
#     GitHub issue, so breakage is never only visible in a job summary.
#   * If more than BREAK_LIMIT links broke in one run, that looks like a site
#     migration, not routine rot: the job does NOT commit or deploy, and fails,
#     so the live site keeps last week's catalog until a person looks.
#   * profile_files.py keeps each broken file's last good profile
#     (`last_good_profile`), so a broken run no longer erases what we knew.

on:
  schedule:
    - cron: "0 9 * * 1"   # 09:00 UTC every Monday
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

env:
  BREAK_LIMIT: "10"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate YAML
        run: python validate.py
      - name: Refresh catalog
        run: |
          cp -f file_profiles.json file_profiles.prev.json
          python profile_files.py --refresh
          python generate_readme.py
      - name: Front-end invariants (no empty topic chips)
        run: python test_frontend.py
      - name: Publish-dir guard (allow-list, 25 MiB/file, no private paths)
        run: python test_publish_dir.py
      - name: Report drift
        run: python report_drift.py file_profiles.prev.json file_profiles.json | tee drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: Count newly broken links
        id: broke
        run: |
          python - <<'EOF' > broke.txt
          import json
          old = json.load(open("file_profiles.prev.json"))
          new = json.load(open("file_profiles.json"))
          for fid, rec in sorted(new.items()):
              if old.get(fid, {}).get("status") == "ok" and rec["status"] != "ok":
                  print(f"- `{fid}` — {rec.get('error', rec['status'])[:200]}\n  {rec['url']}")
          EOF
          n=$(grep -c '^- ' broke.txt || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Newly broken this run: $n (limit $BREAK_LIMIT)"
          rm -f file_profiles.prev.json
      - name: Open or update an issue for broken links
        if: steps.broke.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.broke.outputs.count }}
        run: |
          title="Catalog refresh: links stopped working"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$N" -gt "$BREAK_LIMIT" ]; then
            verdict="**$N links broke in one run (limit $BREAK_LIMIT). Not committed or deployed** — the live site still shows the previous catalog. This usually means a publisher moved its site; run the update-dc-schools-data skill."
          else
            verdict="$N link(s) broke. Committed and deployed as usual; fix the URLs in data_files.yaml."
          fi
          body="$(printf '%s\n\nRun: %s\n\n%s\n' "$verdict" "$run_url" "$(cat broke.txt)")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Stop if the breakage looks like a site migration
        if: fromJSON(steps.broke.outputs.count) > fromJSON(env.BREAK_LIMIT)
        run: |
          echo "::error::${{ steps.broke.outputs.count }} links broke in one run (limit $BREAK_LIMIT). Not committing or deploying."
          exit 1
      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main can move during this ~75-minute run (a merge, another bot commit). A plain
          # `git push` is then rejected ("fetch first") and, worse, the working tree is
          # stale. Rebase onto the latest main and retry; give up loudly if that conflicts.
          push_rebased() {
            for i in 1 2 3 4; do
              if git push; then return 0; fi
              git pull --rebase origin main || { git rebase --abort 2>/dev/null; return 1; }
            done
            return 1
          }
          git add public/catalog.js README.md file_profiles.json
          if git diff --cached --quiet; then
            echo "No changes — catalog is current."
          else
            git commit -m "Automated weekly catalog refresh"
            push_rebased
          fi

      # Discovery: the refresh above only re-downloads URLs we already know, so a new
      # school year or a new release at a new URL would never show up. This step looks
      # for DATA files on the source pages that aren't in the catalog and opens (or
      # updates) one issue listing them. It never edits data_files.yaml — a person
      # reviews the list. Failure here must not block the refresh/deploy.
      - name: Look for new data files on source pages
        id: discover
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set +e
          PDF_BUDGET=300 python find_new_files.py 2>discover.err | grep -E '^coverage=' | tee discover.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 2 ]; then echo "below=yes" >> "$GITHUB_OUTPUT"; grep -E '^COVERAGE_' discover.err >> discover.txt; fi
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]   # any other exit code = the script itself broke
          n=$(awk '/^## (Spreadsheets|PDFs with extractable|Box)/{f=1} /^## (PDFs that could|PDFs not yet|Not checked)/{f=0} f' new_files.md | grep -cE '^- https?://' || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Open or update an issue if the discovery script itself failed
        if: steps.discover.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Catalog discovery: the discovery script failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf 'The weekly new-file discovery step failed, so no new files were looked for this week. The refresh and deploy still ran. Run: %s\n\nLast lines of stderr:\n\n%s\n' "$run_url" "$(tail -20 discover.err 2>/dev/null)")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Keep the full discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-files-report
          path: new_files.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Save the PDF-check cache
        if: always()
        # Losing one cache update only means next week redoes some PDF checks, so a push
        # failure here must not skip the issue and deploy steps below. It still warns.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main can move during this ~75-minute run (a merge, another bot commit). A plain
          # `git push` is then rejected ("fetch first") and, worse, the working tree is
          # stale. Rebase onto the latest main and retry; give up loudly if that conflicts.
          push_rebased() {
            for i in 1 2 3 4; do
              if git push; then return 0; fi
              git pull --rebase origin main || { git rebase --abort 2>/dev/null; return 1; }
            done
            return 1
          }
          git add discovery_pdf_checked.json discovery_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update new-file discovery cache"
            push_rebased || { echo "::warning::Could not push the discovery cache (main moved and the rebase conflicted)."; exit 1; }
          fi
      - name: Open or update an issue for new data files
        if: (steps.discover.outputs.count != '' && steps.discover.outputs.count != '0') || steps.discover.outputs.below == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.discover.outputs.count }}
        run: |
          title="Catalog discovery: new data files on source pages"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '%s candidate file(s) found that are not in data_files.yaml.\n\nThe full report is attached to this run as the "new-files-report" artifact (this issue shows only the first 50,000 characters). If the coverage line below is under its floor, the crawl missed files we already have, so it may be missing new ones too.\n\nRun: %s\n\n%s\n\nAdd the real data files to data_files.yaml (or list declined URLs in discovery_ignore.txt), then re-run profile_files.py.\n\n%s\n' "$N" "$run_url" "$(cat discover.txt)" "$(head -c 50000 new_files.md)")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # Vercel watched this repo and built on push, so publishing needed no
      # step. Cloudflare Pages is a direct upload, so it does. Outside the
      # commit conditional deliberately: public/ holds index.html too, and
      # deploying only when the catalog changed would strand edits to the page.
      # Deploy what is on main NOW, not what this run checked out 75+ minutes ago.
      # Otherwise a merge that landed mid-run would be overwritten by a stale deploy.
      - name: Sync to the latest main before deploying
        run: git pull --rebase origin main
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name=dc-schools-data --branch=main --commit-dirty=true
